[pytest]
testpaths = tests
markers =
    live: runs the year-end scenarios through Amazon Bedrock (needs AWS_BEARER_TOKEN_BEDROCK and AWS_REGION)
    scenarios: real-PDF scenario tests (need tests/data/year-end-test-pack)
addopts = -m "not live" -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
